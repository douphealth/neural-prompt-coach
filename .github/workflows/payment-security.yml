name: Payment security and build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block known unauthorized premium grants
        run: |
          ! grep -R 'setItem.*promptgrade_premium.*true' src
          ! grep -R 'setIsPro(data.isPro)' src
          ! grep -R "params.get('payment') === 'success'" src
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
